<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOLD LEARNER</title>

<style>
body {
  background:#101010;
  color:white;
  font-family:Arial;
  padding:15px;
}
header {
  color:gold;
  text-align:center;
  font-size:28px;
  font-weight:bold;
  padding:15px;
}
.box {
  background:#222;
  padding:18px;
  border-radius:15px;
  margin:15px 0;
}
button,input {
  width:100%;
  padding:13px;
  margin:7px 0;
  border:0;
  border-radius:9px;
  font-size:16px;
}
button {
  background:gold;
  font-weight:bold;
}
input {
  background:#333;
  color:white;
  box-sizing:border-box;
}
.hidden {display:none}
.pattern {
  background:#303030;
  padding:15px;
  border-radius:12px;
  margin:12px 0;
}
.pattern h3 {color:gold}
.result {
  color:gold;
  font-size:20px;
  padding:10px;
}
nav {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
</style>
</head>

<body>

<header>🥇 GOLD LEARNER</header>

<nav>
<button onclick="show('lot')">🥇 Gold Lot</button>
<button onclick="show('currency')">💵 USD to INR</button>
<button onclick="show('patterns')">📊 Patterns</button>
<button onclick="show('music')">🎵 Music</button>
<button onclick="show('settings')">⚙️ Settings</button>
</nav>

<!-- GOLD LOT CALCULATOR -->

<div class="box" id="lot">
<h2>🥇 Gold Lot Calculator</h2>

<label>Gold Price (USD)</label>
<input id="goldPrice" type="number" value="4000">

<label>Contract Size (oz per lot)</label>
<input id="contract" type="number" value="100">

<label>Lot Size</label>
<input id="lotSize" type="number" value="0.01" step="0.01">

<label>USD to INR</label>
<input id="lotRate" type="number" value="94.26">

<button onclick="calculateLot()">CALCULATE</button>

<div class="result" id="lotResult"></div>

<p>यह अनुमानित कुल contract value है, margin या profit नहीं।</p>
</div>

<!-- CURRENCY -->

<div class="box hidden" id="currency">
<h2>💵 Dollar to INR Converter</h2>

<input id="usd" type="number" value="1">

<input id="rate" type="number" value="94.26">

<button onclick="convert()">CONVERT</button>

<button onclick="liveRate()">LIVE RATE UPDATE</button>

<div class="result" id="inr"></div>
<div id="rateStatus"></div>
</div>

<!-- PATTERNS -->

<div class="box hidden" id="patterns">
<h2>📊 Candlestick Patterns</h2>

<input id="search"
placeholder="Search Pattern..."
oninput="searchPattern()">

<div id="patternList"></div>
</div>

<!-- MUSIC PLAYER -->

<div class="box hidden" id="music">

<h2>🎵 Barsaate Song Player</h2>

<p>Barsaat – Banjaare</p>

<audio id="song" preload="metadata">
<source src="music/barsaat.mp3" type="audio/mpeg">
</audio>

<button onclick="playSong()">▶ PLAY</button>

<button onclick="pauseSong()">⏸ PAUSE</button>

<button onclick="repeatSong()" id="repeatBtn">
🔁 REPEAT OFF
</button>

<label>🔊 Volume Control</label>

<input type="range" min="0" max="100"
value="70" oninput="setVolume(this.value)">

<div id="musicStatus"></div>

</div>

<!-- SETTINGS -->

<div class="box hidden" id="settings">

<h2>⚙️ Settings</h2>

<button onclick="toggleTheme()">Change Theme</button>

<button onclick="resetApp()">Reset Calculator</button>

</div>

<script>

// NAVIGATION

function show(id) {
  document.querySelectorAll('main');
  ['lot','currency','patterns','music','settings']
  .forEach(x=>{
    document.getElementById(x).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
}

// GOLD LOT

function calculateLot() {

let price = Number(document.getElementById("goldPrice").value);
let contract = Number(document.getElementById("contract").value);
let lot = Number(document.getElementById("lotSize").value);
let rate = Number(document.getElementById("lotRate").value);

if(price<=0 || contract<=0 || lot<=0 || rate<=0) {
  alert("सही वैल्यू डालें");
  return;
}

let quantity = contract * lot;
let value = quantity * price;
let inr = value * rate;

document.getElementById("lotResult").innerHTML =
"Gold Quantity: "+quantity+" oz<br>"+
"USD Value: $"+value.toFixed(2)+"<br>"+
"INR Value: ₹"+inr.toLocaleString('en-IN',{maximumFractionDigits:2});

}

// CURRENCY

function convert() {
let usd = Number(document.getElementById("usd").value);
let rate = Number(document.getElementById("rate").value);

document.getElementById("inr").innerHTML =
"₹"+(usd*rate).toLocaleString('en-IN',{maximumFractionDigits:2});
}

async function liveRate() {
document.getElementById("rateStatus").innerText="Updating...";

try {
let response = await fetch("https://open.er-api.com/v6/latest/USD");
let data = await response.json();

if(!data.rates || !data.rates.INR) throw Error();

document.getElementById("rate").value=data.rates.INR.toFixed(2);
document.getElementById("lotRate").value=data.rates.INR.toFixed(2);

convert();
calculateLot();

document.getElementById("rateStatus").innerText="Live rate updated";
} catch(e) {
document.getElementById("rateStatus").innerText="Live rate unavailable";
}
}

// MUSIC

let song = document.getElementById("song");

function playSong() {
song.play().catch(()=>{
document.getElementById("musicStatus").innerText="Music file नहीं मिली।";
});
}

function pauseSong() {
song.pause();
}

function repeatSong() {
song.loop=!song.loop;

document.getElementById("repeatBtn").innerText =
song.loop ? "🔁 REPEAT ON" : "🔁 REPEAT OFF";
}

function setVolume(v) {
song.volume=v/100;
}

// SETTINGS

function toggleTheme() {
document.body.style.background =
document.body.style.background==="white" ? "#101010":"white";

document.body.style.color =
document.body.style.color==="black" ? "white":"black";
}

function resetApp() {
document.getElementById("goldPrice").value=4000;
document.getElementById("contract").value=100;
document.getElementById("lotSize").value=0.01;
document.getElementById("lotRate").value=94.26;
document.getElementById("usd").value=1;
document.getElementById("rate").value=94.26;

calculateLot();
convert();
}

function displayPatterns(list) {

let html="";

list.forEach((p,i)=>{

html+=`
<div class="pattern">
<h3>${i+1}. ${p[0]}</h3>
<p>${p[1]}</p>
</div>`;

});

document.getElementById("patternList").innerHTML=html;

}

function searchPattern() {

let q=document.getElementById("search").value.toLowerCase();

let filtered=patterns.filter(p=>
p[0].toLowerCase().includes(q) ||
p[1].toLowerCase().includes(q)
);

displayPatterns(filtered);

}

function openPatterns() {
show('patterns');
displayPatterns(patterns);
}

// BACKWARD COMPATIBILITY
function showPatterns() {
openPatterns();
}

calculateLot();
convert();

</script>

</body>
